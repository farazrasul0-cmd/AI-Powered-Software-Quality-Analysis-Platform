name: CI / CD Verification Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Code Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint Codebase (Ruff)
        run: |
          ruff check backend ml_engine

      - name: Static Type Check (Mypy)
        run: |
          cd backend
          mypy app

      - name: Execute Automated Test Suite (Unit & Integration)
        run: |
          cd backend
          pytest -v tests/unit tests/integration/test_scorecard_and_benchmarks_api.py tests/integration/test_exports_and_webhooks_api.py tests/integration/test_e2e_pipeline.py

  frontend-verification:
    name: Frontend Quality & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npm run test:run

      - name: Build Production Assets (Vite)
        run: |
          cd frontend
          npm run build
